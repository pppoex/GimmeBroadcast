name: Build 1.21.x Forge Versions

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Cache Gradle wrapper
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-wrapper-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Cache NeoForge mappings & libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/repositories
          key: ${{ runner.os }}-gradle-caches-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-caches-

      - name: Build all versions
        run: | 
          chmod +x ./gradlew
          ./gradlew build --no-daemon --continue

      - name: Collect jars
        run: |
          mkdir -p artifacts
          find . -path "*/build/libs/GimmeBroadcast*.jar" ! -name "*sources*" -exec cp -v {} artifacts/ \;

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GimmeBroadcast-jars
          path: artifacts/*.jar
          compression-level: 0
